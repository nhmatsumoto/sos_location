[project]
name = "SOS-LOCATION"
feature = "Building Intelligence"
version = "1.0"
language = "pt-BR"
prompt_type = "implementation"
target = "AI coding agent"
description = """
Implementar um módulo de inteligência geoespacial capaz de combinar dados vetoriais do OpenStreetMap,
ortofotos e imagens aéreas para detectar, segmentar, classificar, reconciliar e validar prédios e casas.
O módulo deve enriquecer o City Digital Twin do SOS-LOCATION e fornecer dados confiáveis para simulações
de desastres, análise de impacto, planejamento de resgate e visualização 3D.
"""

[agent]
role = "Arquiteto de Software, Engenheiro Geoespacial e Engenheiro de Machine Learning"
mission = """
Analisar a arquitetura existente do SOS-LOCATION, preservar seus padrões e implementar a melhoria
Building Intelligence de forma incremental, testável, desacoplada e preparada para processamento
distribuído. Não substituir dados existentes sem rastreabilidade. Toda inferência deve manter origem,
versão do modelo, confiança e histórico de validação.
"""
execution_mode = "iterative"
require_existing_code_analysis = true
require_tests = true
require_documentation = true
require_migrations = true
require_backward_compatibility = true
require_human_validation = true

[agent.behavior]
use_ubiquitous_language = true
follow_domain_driven_design = true
prefer_vertical_slices = true
avoid_big_bang_rewrite = true
preserve_existing_architecture = true
reuse_existing_components = true
document_tradeoffs = true
stop_on_destructive_change = true
ask_only_when_blocked = true
produce_working_code = true
do_not_generate_fake_production_results = true

[context]
product_goal = """
O SOS-LOCATION é uma plataforma de simulação de desastres naturais baseada em cidades digitais 3D.
A plataforma processa dados geoespaciais, executa simulações e apresenta informações táticas para
equipes de resposta, infraestrutura, rotas, edifícios, recursos e áreas afetadas.
"""
current_focus = "Construção e evolução dos ambientes de simulação"
primary_use_cases = [
  "Detectar construções ausentes no OpenStreetMap",
  "Corrigir ou sugerir contornos de edifícios imprecisos",
  "Identificar novos prédios, alterações e possíveis demolições",
  "Classificar construções por uso provável",
  "Estimar atributos úteis para simulações",
  "Enriquecer o City Digital Twin",
  "Preparar dados para simulações de enchentes, terremotos, incêndios, deslizamentos e tsunamis"
]

[architecture]
style = "DDD modular monolith evolutivo com workers distribuídos"
backend = ".NET 10"
language = "C#"
database = "PostgreSQL com PostGIS"
orm = "EF Core para modelagem e migrações"
read_write = "Dapper para consultas e operações críticas de alto desempenho"
object_storage = "S3-compatible object storage"
machine_learning = "Python"
ml_api = "FastAPI ou serviço gRPC independente"
frontend = "Aplicação web geoespacial existente do SOS-LOCATION"
map_rendering = "MapLibre, CesiumJS, deck.gl, Three.js ou componentes já adotados no projeto"
messaging = "Utilizar abstração existente; caso ausente, criar contratos independentes do broker"
containerization = "Docker e Docker Compose"
observability = "OpenTelemetry, logs estruturados, métricas e tracing"

[bounded_context]
name = "Building Intelligence"
purpose = """
Transformar observações geoespaciais provenientes de fontes heterogêneas em representações
auditáveis de construções, mantendo separadas a observação bruta, a inferência automática,
a reconciliação com fontes existentes e a validação humana.
"""

[bounded_context.dependencies]
upstream = [
  "Data Catalog",
  "Geospatial Ingestion",
  "City Digital Twin",
  "Scenario Management"
]
downstream = [
  "Simulation Runtime",
  "Impact Analysis",
  "Visualization",
  "Rescue Planning"
]

[ubiquitous_language]
building_observation = "Observação bruta proveniente de imagem, OSM, PLATEAU ou outra fonte"
building_footprint = "Geometria confirmada ou aceita de uma construção"
building_candidate = "Construção detectada automaticamente ainda não confirmada"
building_classification = "Classificação probabilística do tipo ou uso da construção"
reconciliation = "Comparação entre uma observação detectada e registros geoespaciais existentes"
validation = "Decisão humana sobre uma detecção, geometria, classificação ou alteração"
confidence = "Probabilidade calibrada associada a uma inferência"
provenance = "Origem, licença, data, versão e transformações aplicadas aos dados"
change_detection = "Identificação de construção nova, alterada, removida ou divergente"
model_bundle = "Conjunto versionado de pesos, configuração, métricas e metadados de um modelo"
review_queue = "Fila de candidatos que exigem validação humana"

[domain.rules]
rule_01 = "Nenhum resultado de IA pode substituir automaticamente um BuildingFootprint confirmado."
rule_02 = "Toda inferência deve registrar modelo, versão, data, confiança, entrada e origem dos dados."
rule_03 = "Candidatos abaixo do limiar de confiança devem ser enviados para revisão."
rule_04 = "Resultados conflitantes entre OSM, PLATEAU, imagem aérea e dados locais devem permanecer rastreáveis."
rule_05 = "Geometrias inválidas devem ser corrigidas ou rejeitadas antes da persistência."
rule_06 = "Todas as geometrias devem possuir SRID explícito."
rule_07 = "Operações espaciais devem ser executadas no banco quando forem mais eficientes."
rule_08 = "Dados de licença incompatível não podem ser misturados ou redistribuídos sem validação."
rule_09 = "A IA sugere; a decisão final pode ser automática apenas em fluxos explicitamente configurados."
rule_10 = "Modelos sem aprovação não podem ser promovidos para produção."

[data_sources]
required = [
  "OpenStreetMap building footprints",
  "Ortofotos ou imagens aéreas legalmente utilizáveis",
  "PLATEAU quando disponível",
  "Modelo digital de elevação quando útil",
  "Metadados do catálogo geoespacial do projeto"
]
optional = [
  "Imagens de drone",
  "Dados municipais",
  "Cadastros públicos de edificações",
  "Sensores remotos",
  "Resultados de inspeção humana"
]
forbidden_default = [
  "Download massivo dos tiles padrão de renderização do OpenStreetMap",
  "Uso de imagens sem licença compatível",
  "Uso de dados sem metadados de origem"
]

[ml]
initial_model = "SegFormer-B2"
advanced_model = "Mask2Former"
refinement_model = "SAM 2"
pretraining = "SatlasPretrain ou pesos equivalentes para sensoriamento remoto"
classification_model = "CatBoost ou LightGBM"
framework = "PyTorch"
export_format = "ONNX quando tecnicamente viável"
serving = "FastAPI ou gRPC"
training_is_separate_from_serving = true
support_batch_inference = true
support_gpu = true
support_cpu_fallback = true
require_model_registry = true
require_calibration = true
require_explainability = true
require_abstention = true

[ml.tasks]
semantic_segmentation = true
instance_segmentation = true
footprint_vectorization = true
building_classification = true
change_detection = true
confidence_calibration = true
out_of_distribution_detection = true

[ml.inputs]
raster_channels = [
  "RGB",
  "NIR quando disponível",
  "Elevação quando disponível"
]
vector_context = [
  "OSM buildings",
  "Road network",
  "Land use",
  "Administrative boundaries",
  "PLATEAU building metadata"
]
tabular_features = [
  "Área do footprint",
  "Perímetro",
  "Compacidade",
  "Orientação",
  "Altura",
  "Quantidade de andares",
  "Forma do telhado",
  "Distância até vias",
  "Densidade urbana",
  "Uso do solo",
  "Tags OSM",
  "Atributos PLATEAU"
]

[ml.outputs]
segmentation_mask = true
instance_masks = true
polygon_candidates = true
building_type_probabilities = true
estimated_levels = true
estimated_height = true
change_status = true
confidence_score = true
uncertainty_score = true
review_required = true

[ml.model_lifecycle]
stages = [
  "Development",
  "Evaluation",
  "Shadow",
  "Approved",
  "Champion",
  "Deprecated"
]
promotion_requires = [
  "Métricas mínimas aprovadas",
  "Avaliação espacial por região",
  "Avaliação temporal",
  "Validação de licença dos dados",
  "Teste de regressão",
  "Aprovação humana"
]

[pipeline]
name = "Building Intelligence Processing Pipeline"
steps = [
  "Registrar dataset e proveniência",
  "Ingerir ortofoto ou imagem aérea",
  "Normalizar projeção e resolução",
  "Dividir o raster em tiles com sobreposição",
  "Executar segmentação",
  "Combinar tiles e remover artefatos de borda",
  "Vetorizar máscaras",
  "Simplificar e validar polígonos",
  "Comparar com footprints existentes",
  "Classificar o tipo provável da construção",
  "Detectar mudanças",
  "Aplicar regras de confiança e qualidade",
  "Persistir candidatos",
  "Enviar conflitos para revisão",
  "Publicar footprints aprovados no City Digital Twin"
]

[pipeline.vectorization]
minimum_area_m2 = 6.0
simplification_tolerance_m = 0.25
repair_invalid_geometry = true
remove_small_artifacts = true
merge_adjacent_fragments = true
preserve_holes = true
default_srid = 4326
processing_srid_strategy = "Usar projeção métrica local apropriada para cálculos"

[pipeline.reconciliation]
intersection_metric = "IoU"
exact_match_threshold = 0.85
geometry_changed_threshold = 0.55
new_building_threshold = 0.20
possible_removal_requires_temporal_confirmation = true
use_centroid_distance = true
use_area_difference = true
use_shape_similarity = true
use_source_recency = true

